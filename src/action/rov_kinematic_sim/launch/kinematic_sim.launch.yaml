---
# kinematic_sim.launch.yaml
# Simulated ROV in place of the vehicle and its localization: follows /cmd_vel and publishes
# /odom plus the map -> odom -> base_link transforms.

launch:
  - arg:
      name: params_file
      default: "$(find-pkg-share rov_kinematic_sim)/config/kinematic_sim.yaml"
      description: Simulator parameters, e.g. to add a water current

  - arg:
      name: autostart
      default: "true"
      description: Automatically configure and activate the simulator

  # Simulated odometry does not drift, so localization is the identity map -> odom transform
  - node:
      pkg: "tf2_ros"
      exec: "static_transform_publisher"
      name: "map_to_odom"
      args: "--frame-id map --child-frame-id odom"

  - node:
      pkg: "rov_kinematic_sim"
      exec: "kinematic_sim_node"
      name: "kinematic_sim"
      output: "screen"
      param:
        - from: "$(var params_file)"

  - node:
      pkg: "wato_lifecycle_manager"
      exec: "wato_lifecycle_manager_node"
      name: "kinematic_sim_lifecycle_manager"
      output: "screen"
      param:
        - name: "node_names"
          value:
            - /kinematic_sim
        - name: autostart
          value: $(var autostart)
        - name: bond_enabled
          value: false
