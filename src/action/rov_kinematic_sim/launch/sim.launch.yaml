---
# sim.launch.yaml
# The action module with this simulator in place of the vehicle and its localization:
# action_bringup's Nav2 stack, plus kinematic_sim.launch.yaml.

launch:
  # Each include gets its own group because includes leak their launch arguments: Nav2 and the
  # simulator both declare params_file, and without the groups one would load the other's.
  - group:
      children:
        - include:
            file: "$(find-pkg-share action_bringup)/launch/action.launch.yaml"

  - group:
      children:
        - include:
            file: "$(find-pkg-share rov_kinematic_sim)/launch/kinematic_sim.launch.yaml"
