---
# A BlueROV2-class vehicle in a pool, starting at the surface.

/**/kinematic_sim:
  ros__parameters:
    update_rate_hz: 50.0
    cmd_vel_timeout_s: 0.5
    odom_frame: odom
    base_frame: base_link
    initial_pose: [0.0, 0.0, 0.0, 0.0]  # x, y, z (m), yaw (rad)
    response_time_s: 0.3  # velocity lag: thruster spin-up, drag and added mass
    max_linear_speed: [1.0, 0.6, 0.6]  # surge, sway, heave (m/s)
    max_yaw_rate: 1.0  # rad/s
    # A steady push in the world frame (m/s). Pools have no current, but tether drag and the
    # positive buoyancy ROVs are trimmed with act much the same, so the vehicle drifts when idle.
    water_current: [0.03, -0.02, 0.02]
    surface_z: 0.0
