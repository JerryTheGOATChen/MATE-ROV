---
# nav2.launch.yaml
# Nav2 servers with the ROV's 3D plugins (rov_nav2_plugins). Needs /odom and the
# map -> odom -> base_link transforms from the vehicle, or from a simulator.

launch:
  - arg:
      name: autostart
      default: "true"
      description: Automatically configure and activate the Nav2 servers

  - arg:
      name: params_file
      default: "$(find-pkg-share action_bringup)/config/nav2.yaml"
      description: Nav2 parameters

  - arg:
      name: use_sim_time
      default: "false"
      description: Use the simulator's /clock, such as Gazebo's

  - set_parameter:
      name: use_sim_time
      value: $(var use_sim_time)

  # Build a probabilistic 3D occupancy map directly from the sonar point cloud. The planner uses
  # /octomap_binary; occupied_cells_vis_array and octomap_point_cloud_centers are for visualization.
  - node:
      pkg: "octomap_server"
      exec: "octomap_server_node"
      name: "octomap_server"
      output: "screen"
      param:
        - name: frame_id
          value: "map"
        - name: base_frame_id
          value: "base_link"
        - name: resolution
          value: 0.1
        # Keep the tree pruned and avoid generating map products unused by the 3D planner. The
        # occupied marker stream remains available for Foxglove.
        - name: compress_map
          value: true
        - name: publish_free_space
          value: false
        - name: incremental_2D_projection
          value: false
        - name: colored_map
          value: false
        - name: sensor_model.max_range
          value: 8.0
        - name: sensor_model.hit
          value: 0.7
        - name: sensor_model.miss
          value: 0.4
        - name: latch
          value: true
        - name: use_height_map
          value: true
        - name: filter_ground_plane
          value: false
        - name: occupancy_min_z
          value: -4.0
        - name: occupancy_max_z
          value: 0.0
      remap:
        - from: "cloud_in"
          to: "/sonar/points"

  - node:
      pkg: "nav2_controller"
      exec: "controller_server"
      name: "controller_server"
      output: "screen"
      param:
        - from: "$(var params_file)"

  - node:
      pkg: "nav2_planner"
      exec: "planner_server"
      name: "planner_server"
      output: "screen"
      param:
        - from: "$(var params_file)"

  - node:
      pkg: "nav2_bt_navigator"
      exec: "bt_navigator"
      name: "bt_navigator"
      output: "screen"
      param:
        - from: "$(var params_file)"
        - name: default_nav_to_pose_bt_xml
          value: "$(find-pkg-share action_bringup)/behavior_trees/navigate_to_pose_3d.xml"
        - name: default_nav_through_poses_bt_xml
          value: "$(find-pkg-share action_bringup)/behavior_trees/navigate_through_poses_3d.xml"

  # Nav2's own lifecycle manager: the Nav2 servers bond with it, so if one crashes it brings the
  # others down and the controller stops sending commands
  - node:
      pkg: "nav2_lifecycle_manager"
      exec: "lifecycle_manager"
      name: "lifecycle_manager_navigation"
      output: "screen"
      param:
        - name: autostart
          value: $(var autostart)
        - name: "node_names"
          value:
            - controller_server
            - planner_server
            - bt_navigator
