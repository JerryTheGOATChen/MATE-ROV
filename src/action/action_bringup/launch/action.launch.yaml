# action.launch.yaml
# Entry point for the action container (see modules/docker-compose.yaml).
#
# Halloween hackathon: runs the haunted house and the ghost's brain together. To iterate on the
# brain, run haunted_house.launch.yaml and ghost_brain.launch.yaml in separate shells instead, so
# you can restart the brain without restarting the house.

launch:
  - arg:
      name: house_file
      default: "$(find-pkg-share haunted_house)/config/haunted_house.yaml"
      description: The house layout, people, candies and rules

  - include:
      file: "$(find-pkg-share haunted_house)/launch/haunted_house.launch.yaml"
      arg:
        - name: house_file
          value: $(var house_file)

  # The brain runs under its own lifecycle manager, which configures and activates it
  - include:
      file: "$(find-pkg-share ghost_brain)/launch/ghost_brain.launch.yaml"
