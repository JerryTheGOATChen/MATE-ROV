---
# Nav2 for the ROV: 3D planning around the sonar's obstacles and pure pursuit control from
# rov_nav2_plugins, modeled on Orca4 (https://github.com/clydemcqueen/orca4). Frames follow
# REP 105: map -> odom -> base_link, with z up (depth is negative z).

bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
    # Blackboard keys the behavior trees write error codes to, reported in navigation results
    error_code_names: ["compute_path_error_code", "follow_path_error_code"]
    # The behavior tree files are set in nav2.launch.yaml, which can resolve package paths

planner_server:
  ros__parameters:
    expected_planner_frequency: 1.0
    planner_plugins: ["OctomapPlanner3D"]
    # A* searches the OctoMap in x, y and z. The collision radius includes the vehicle's 0.35 m
    # half-width plus 0.10 m of clearance.
    OctomapPlanner3D:
      plugin: "rov_nav2_plugins::OctomapPlanner3D"
      octomap_topic: "/octomap_binary"
      # The server publishes a complete binary tree for every 5 Hz sonar frame. The planner runs
      # at 1 Hz, so decoding at 2 Hz keeps obstacle latency low without repeatedly rebuilding a
      # tree that cannot be used by an intervening plan.
      map_update_interval: 0.5
      planning_resolution: 0.25
      collision_radius: 0.45
      min_bounds: [-11.0, -7.0, -4.0]
      max_bounds: [11.0, 7.0, 0.0]
      unknown_is_occupied: false
      max_expansions: 250000

controller_server:
  ros__parameters:
    controller_frequency: 20.0
    # cmd_vel carries the base_link frame, which the vehicle interface checks
    enable_stamped_cmd_vel: true
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]
    progress_checker:
      plugin: "rov_nav2_plugins::ProgressChecker3D"
      required_movement_radius: 0.3  # m, in 3D
      required_movement_angle: 0.3  # rad
      movement_time_allowance: 10.0  # s
    goal_checker:
      plugin: "rov_nav2_plugins::GoalChecker3D"
      xy_goal_tolerance: 0.2  # m
      z_goal_tolerance: 0.15  # m
      yaw_goal_tolerance: 0.15  # rad
    FollowPath:
      plugin: "rov_nav2_plugins::PurePursuitController3D"
      lookahead_dist: 0.6  # m
      approach_gain: 1.5  # 1/s, speed per unit of remaining distance near the goal
      transform_tolerance: 0.1  # s
      # Limits per vehicle axis: surge (x), sway (y), heave (z) and yaw
      max_vel_x: 0.5
      max_vel_y: 0.3
      max_vel_z: 0.3
      max_vel_yaw: 0.6
      max_accel_x: 0.4
      max_accel_y: 0.3
      max_accel_z: 0.3
      max_accel_yaw: 0.6

# The local costmap is unused: the controller follows the planned path without checking it. Keep a
# tiny, low-rate placeholder because Nav2's controller server requires a Costmap2DROS lifecycle
# object. It contains no obstacle source; all obstacle state lives in the OctoMap.
local_costmap:
  local_costmap:
    ros__parameters:
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.5
      update_frequency: 1.0
      publish_frequency: 0.0
      plugins: ["inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"

# Nav2 also requires a global Costmap2DROS even though OctomapPlanner3D reads /octomap_binary
# directly. A coarse, non-publishing placeholder preserves the pool bounds and frame plumbing
# without maintaining the original 30,800-cell 2D projection.
global_costmap:
  global_costmap:
    ros__parameters:
      global_frame: map
      robot_base_frame: base_link
      # Fixed window over the pool, centered on the map frame's origin. Resize it for the
      # competition pool.
      rolling_window: false
      width: 22
      height: 14
      origin_x: -11.0
      origin_y: -7.0
      resolution: 1.0
      robot_radius: 0.35  # m, BlueROV2 Heavy half-width plus a margin
      update_frequency: 0.5
      publish_frequency: 0.0
      always_send_full_costmap: false
      track_unknown_space: false
      plugins: ["inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
