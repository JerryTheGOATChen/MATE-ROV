---
# Nav2 for the ROV: 3D planning around the sonar's obstacles and pure pursuit control from
# rov_nav2_plugins, modeled on Orca4 (https://github.com/clydemcqueen/orca4). Frames follow
# REP 105: map -> odom -> base_link, with z up (depth is negative z).

bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
    # Blackboard keys the behavior trees write error codes to, reported in navigation results
    error_code_names: ["compute_path_error_code", "follow_path_error_code"]
    # The behavior tree files are set in nav2.launch.yaml, which can resolve package paths

planner_server:
  ros__parameters:
    expected_planner_frequency: 1.0
    planner_plugins: ["CostmapPlanner3D"]
    # Routes around obstacles in the global costmap: Nav2's Smac 2D planner finds the horizontal
    # route, and the plugin adds depth.
    CostmapPlanner3D:
      plugin: "rov_nav2_plugins::CostmapPlanner3D"
      xy_planner: "nav2_smac_planner::SmacPlanner2D"
      z_before_xy: false  # true: dive or surface first, then move horizontally
      xy:
        # A goal inside an obstacle fails. With a tolerance, the path would end in the obstacle,
        # because it always ends exactly at the goal.
        tolerance: 0.0
        max_planning_time: 1.0  # s
        cost_travel_multiplier: 2.0  # keeps the route away from inflated obstacles

controller_server:
  ros__parameters:
    controller_frequency: 20.0
    # cmd_vel carries the base_link frame, which the vehicle interface checks
    enable_stamped_cmd_vel: true
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]
    progress_checker:
      plugin: "rov_nav2_plugins::ProgressChecker3D"
      required_movement_radius: 0.3  # m, in 3D
      required_movement_angle: 0.3  # rad
      movement_time_allowance: 10.0  # s
    goal_checker:
      plugin: "rov_nav2_plugins::GoalChecker3D"
      xy_goal_tolerance: 0.2  # m
      z_goal_tolerance: 0.15  # m
      yaw_goal_tolerance: 0.15  # rad
    FollowPath:
      plugin: "rov_nav2_plugins::PurePursuitController3D"
      lookahead_dist: 0.6  # m
      approach_gain: 1.5  # 1/s, speed per unit of remaining distance near the goal
      transform_tolerance: 0.1  # s
      # Limits per vehicle axis: surge (x), sway (y), heave (z) and yaw
      max_vel_x: 0.5
      max_vel_y: 0.3
      max_vel_z: 0.3
      max_vel_yaw: 0.6
      max_accel_x: 0.4
      max_accel_y: 0.3
      max_accel_z: 0.3
      max_accel_yaw: 0.6

# The local costmap is unused: the controller follows the planned path without checking it, and
# replanning once a second (see the behavior trees) handles obstacles seen along the way. A ROS
# parameter file cannot express an empty plugin list, so it loads one inflation layer, which has
# nothing to inflate.
local_costmap:
  local_costmap:
    ros__parameters:
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.1
      update_frequency: 5.0
      publish_frequency: 1.0
      plugins: ["inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"

# Obstacles from the sonar, for CostmapPlanner3D, kept by the stock spatio-temporal voxel layer
# (STVL). See DEVELOPING.md.
global_costmap:
  global_costmap:
    ros__parameters:
      global_frame: map
      robot_base_frame: base_link
      # Fixed window over the pool, centered on the map frame's origin. Resize it for the
      # competition pool.
      rolling_window: false
      width: 22
      height: 14
      origin_x: -11.0
      origin_y: -7.0
      resolution: 0.1
      robot_radius: 0.35  # m, BlueROV2 Heavy half-width plus a margin
      update_frequency: 2.0
      publish_frequency: 1.0
      always_send_full_costmap: true  # Foxglove does not apply partial costmap updates
      track_unknown_space: false
      plugins: ["voxel_layer_3d", "inflation_layer"]
      voxel_layer_3d:
        plugin: "rov_nav2_plugins::VoxelLayer3D"
        topic: /sonar/points
        min_z: -4.4 # relative floor depth 
        max_z: 0.0 # relative water surface
        obstacle_range: 8.0
        voxel_decay: 200.0 # in seconds, how long an obstacle out of the sonar's view is remembered
        robot_half_height: 0.2 # m, half of vehicle's height
        inflation_radius: 0.2 
        cost_scaling_facto: 3.0
        transform_tolerance: 0.1  # s, for the sonar's frame to map
        publish_voxel_costs: true
      # Keeps the route well clear of obstacles: pure pursuit cuts inside the route's corners
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 1.0
        cost_scaling_factor: 3.0
