---
ghost_brain:
  ros__parameters:
    # How often to send a velocity command
    control_rate_hz: 20.0
    # How often to plan again on the way, because people keep walking
    replan_period_s: 0.5
    # The house's frame, and the ghost's own frame, which commands are in
    map_frame: map
    base_frame: base_link

    #Some tuning I can use

    tracker:
      # How much you trust a new sighting to correct position, higher more trust
      alpha: 0.25
      # How much you trust a new sighting to correct velocity, higher more trust
      beta: 0.1
      # Rule of thumb of beta ≈ alpha² / (2 − alpha)

    controller:
      # How far down the path to chase, bigger is smoother but cuts corners
      lookahead_dist: 0.6

    planner:
      # How far to keep the ghost's center from walls and furniture (m). 0.3 is touching.
      # Doors are 1.2 m, so this leaves 1.2 - 2 * this of room to fly through
      inflation_radius: 0.38

    explorer:
      # Seconds until something is "unseen", higher means u patrol less
      fade_time_s: 60.0

    targeting:
      # Switch targets only when the new one is this many x better, Higher = less flip-flopping
      hysteresis: 3.0
      # How far you aim infront (2s * 0.6m/s = 1.2m)
      intercept_max_time_s: 2.0
