---
# Localization for the simulated ROV: robot_localization's EKF fuses the DVL's velocity, the depth
# sensor's z and the IMU's orientation and turn rate. It publishes /odom and odom -> base_link, as
# the real vehicle's localization would. Nothing measures x and y directly, so they drift slowly.

/**/ekf_filter_node:
  ros__parameters:
    frequency: 30.0
    sensor_timeout: 0.5
    two_d_mode: false
    publish_tf: true

    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom

    # Rows: x y z, roll pitch yaw, vx vy vz, vroll vpitch vyaw, ax ay az
    odom0: /sensors/dvl
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  true,  true,
                   false, false, false,
                   false, false, false]

    odom1: /sensors/depth
    odom1_config: [false, false, true,
                   false, false, false,
                   false, false, false,
                   false, false, false,
                   false, false, false]

    imu0: /sensors/imu
    imu0_config: [false, false, false,
                  true,  true,  true,
                  false, false, false,
                  true,  true,  true,
                  false, false, false]
