---
# sim.launch.yaml
# The action module's Nav2, unchanged, flying the simulated ROV in the Gazebo pool.

launch:
  # Each include gets its own group, because includes leak their launch arguments. The simulator's
  # arguments, such as gui and the sensor noise, still pass through to gazebo.launch.yaml.
  - group:
      children:
        - include:
            file: "$(find-pkg-share rov_gazebo_sim)/launch/gazebo.launch.yaml"

  - group:
      children:
        - include:
            file: "$(find-pkg-share action_bringup)/launch/nav2.launch.yaml"
            arg:
              - name: use_sim_time
                value: "true"
