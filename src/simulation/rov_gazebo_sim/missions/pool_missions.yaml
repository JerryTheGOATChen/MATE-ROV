---
# Missions in the Gazebo pool, with sensor noise, the EKF and the sonar in the loop. They run in
# order, each starting where the previous one ended; the ROV spawns at (0, 0, -0.3) facing east.
# Run them with:
#
#   ros2 run rov_mission_runner mission_runner \
#     $(ros2 pkg prefix --share rov_gazebo_sim)/missions/pool_missions.yaml \
#     --truth-topic /sim/ground_truth
#
# The runner scores the ground truth, so localization drift counts against the vehicle.

frame_id: map

defaults:
  timeout_s: 90
  xy_tolerance_m: 0.35
  z_tolerance_m: 0.25
  yaw_tolerance_deg: 15
  # Replanning around obstacles as the sonar finds them changes the path under the vehicle
  max_path_deviation_m: 0.6
  # The controller's limits in action_bringup/config/nav2.yaml
  max_speed: {x: 0.5, y: 0.3, z: 0.3, yaw: 0.6}

missions:
  # Dive and line up west of the mooring line at (4, 2)
  - name: leave_the_surface
    waypoints:
      - {x: 1.5, y: 2.0, z: -1.0, yaw_deg: 0}

  # The straight line runs through the mooring line: the sonar sees it and the planner goes around.
  # Clearance is the line's 0.15 m radius plus the ROV's 0.3 m half-width.
  - name: around_the_mooring
    waypoints:
      - {x: 7.0, y: 2.0, z: -1.5, yaw_deg: 0}
    obstacles:
      - {x: 4.0, y: 2.0, radius_m: 0.45}

  # Cross the pool and settle 1 m above the floor. The sonar sees the floor ahead, and the costmap
  # must ignore it, or every route would be blocked.
  - name: near_the_floor
    waypoints:
      - {x: -3.0, y: 0.0, z: -3.0, yaw_deg: 180}
    obstacles:
      - {x: 4.0, y: 2.0, radius_m: 0.45}

  # The straight line runs through the net wall at (-7, 2), and the wall reaches the north side of the
  # pool, so the only route is a U around its south end at (-7, -0.5). Ending at 30 deg turns the
  # vehicle through north on the way, so the sonar keeps the wall in view. Clearance is the net's
  # 0.05 m half-thickness plus the ROV's 0.3 m half-width.
  - name: around_the_net
    waypoints:
      - {x: -9.0, y: 3.0, z: -1.5, yaw_deg: 30}
    obstacles:
      - {x: -7.0, y: 2.0, radius_m: 0.35}
      - {x: -7.0, y: -0.5, radius_m: 0.35}

  # Back to the start and up near the surface, around the net's south end again
  - name: return
    waypoints:
      - {x: 0.0, y: 0.0, z: -0.3, yaw_deg: 0}
    obstacles:
      - {x: -7.0, y: 2.3, radius_m: 0.35}
      - {x: -7.0, y: -0.5, radius_m: 0.35}

  # The rest need the 3D planner: their obstacles don't span every depth, so the route can go over,
  # under or around them. Obstacles with z_min or z_max are bounded by the obstacle's bottom and top
  # plus the ROV's 0.13 m half-height.

  # The straight line passes just above the instrument package hanging at (0, -4), through its
  # 2 cm line to the surface. Over the package means crossing the line, so the route must go under
  # or around.
  - name: past_the_package
    waypoints:
      - {x: 0.0, y: -5.4, z: -1.5, yaw_deg: -90}
    obstacles:
      - {x: 0.0, y: -4.0, radius_m: 0.65, z_min: -1.88, z_max: -1.12}  # the package
      - {x: 0.0, y: -4.0, radius_m: 0.31, z_min: -1.3}  # its line

  - name: line_up_on_the_gate
    waypoints:
      - {x: 5.0, y: -2.0, z: -2.5, yaw_deg: 0}

  # Through the PVC gate at (7, -2): between its posts, 1.5 m apart, and under its crossbar at
  # z = -1. Going around or over it is longer.
  - name: through_the_gate
    waypoints:
      - {x: 9.0, y: -2.0, z: -2.5, yaw_deg: 0}
    obstacles:
      - {x: 7.0, y: -1.25, radius_m: 0.35, z_max: -0.87}  # north post
      - {x: 7.0, y: -2.75, radius_m: 0.35, z_max: -0.87}  # south post
      - {x: 7.0, y: -2.0, radius_m: 1.1, z_min: -1.18, z_max: -0.82}  # crossbar, as a disc

  # Across the pool to south of the shipwreck, 0.5 m above the floor
  - name: to_the_wreck
    waypoints:
      - {x: -4.0, y: 1.2, z: -3.5, yaw_deg: 90}

  # The straight line runs through the shipwreck, a 2.4 x 1.0 x 0.9 m block on the floor at
  # (-4, 3.5) turned 20 deg, which the route goes over or around. The block is scored as five
  # discs along its length, each covering 0.48 m of it.
  - name: over_the_wreck
    waypoints:
      - {x: -4.0, y: 5.4, z: -3.5, yaw_deg: 90}
    obstacles:
      - {x: -4.90, y: 3.17, radius_m: 0.85, z_max: -2.97}
      - {x: -4.45, y: 3.34, radius_m: 0.85, z_max: -2.97}
      - {x: -4.00, y: 3.50, radius_m: 0.85, z_max: -2.97}
      - {x: -3.55, y: 3.66, radius_m: 0.85, z_max: -2.97}
      - {x: -3.10, y: 3.83, radius_m: 0.85, z_max: -2.97}
