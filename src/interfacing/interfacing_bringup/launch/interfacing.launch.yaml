---
# interfacing.launch.yaml
# Entry point for the interfacing container (see modules/docker-compose.yaml).

launch:
  - arg:
      name: autostart
      default: "true"
      description: Automatically configure and activate managed nodes

  - arg:
      name: bond_enabled
      default: "false"
      description: Enable bond-based crash detection

  # Lifecycle Manager: add a node_names parameter listing every lifecycle node above
  - node:
      pkg: "wato_lifecycle_manager"
      exec: "wato_lifecycle_manager_node"
      name: "interfacing_lifecycle_manager"
      namespace: "interfacing"
      output: "screen"
      param:
        - name: autostart
          value: $(var autostart)
        - name: transition_timeout_s
          value: 10.0
        - name: bond_timeout_s
          value: 4.0
        - name: bond_enabled
          value: $(var bond_enabled)
